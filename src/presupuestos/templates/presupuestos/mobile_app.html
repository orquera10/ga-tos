<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ga$tos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color-scheme: dark;
      color: #f4f3fa;
      background: #080a0f;
      font-synthesis: none;
      --purple: #6758e8;
      --purple-dark: #5748d8;
      --green: #159c79;
      --rose: #ee6e68;
      --muted: #9294a5;
      --line: #272a37;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-width: 320px;
      min-height: 100vh;
      background: #0d0f16;
      color: #f4f3fa;
      overflow-x: hidden;
    }
    button, input, select {
      font-family: inherit;
      outline: none;
    }
    button {
      cursor: pointer;
    }
    .android-stage {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, rgba(103, 88, 232, 0.12), transparent 32rem), #080a0f;
    }
    .android-app {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      overflow-x: hidden;
      background: #0d0f16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.42);
    }
    .app-header {
      min-height: 78px;
      padding: 16px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #0d0f16;
      position: sticky;
      top: 0;
      z-index: 15;
    }
    .hello {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .avatar {
      width: 39px;
      height: 39px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #7668f3, #5848d5);
      font: 700 12px "Manrope", sans-serif;
      box-shadow: 0 6px 15px rgba(92, 76, 219, 0.22);
    }
    .hello-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .hello-text span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }
    .hello-text strong {
      margin-top: 3px;
      font: 700 15px "Manrope", sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .budget-selector-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 175px;
      padding: 8px 11px;
      border: 1px solid #2d3142;
      border-radius: 12px;
      background: #151821;
      color: #f4f3fa;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.18);
    }
    .budget-selector-pill span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .budget-selector-pill svg {
      flex-shrink: 0;
      color: #9c91ff;
    }
    .header-icon {
      position: relative;
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border: 1px solid #252834;
      border-radius: 12px;
      background: #151821;
      color: #a9aaba;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.13);
    }
    .header-icon i {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 7px;
      height: 7px;
      border: 2px solid #151821;
      border-radius: 50%;
      background: var(--rose);
    }
    .screen {
      min-height: calc(100vh - 78px);
      padding: 8px 16px 115px;
    }
    .balance-card {
      position: relative;
      min-height: 235px;
      padding: 23px 21px;
      overflow: hidden;
      border-radius: 24px;
      color: white;
      background: linear-gradient(140deg, #3e328f 0%, #5546c7 55%, #6e60dd 100%);
      box-shadow: 0 15px 34px rgba(53, 42, 142, 0.35);
    }
    .balance-head {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .balance-head span {
      color: #d9d5ff;
      font-size: 11px;
      font-weight: 500;
    }
    .balance-value {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .balance-value h1 {
      margin: 5px 0 0;
      font: 700 clamp(24px, 7.2vw, 33px) "Manrope", sans-serif;
      letter-spacing: -1.2px;
    }
    .balance-value button {
      padding: 5px;
      border: 0;
      color: #d9d5ff;
      background: transparent;
    }
    .period {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      font-size: 10px;
      font-weight: 600;
      max-width: 140px;
    }
    .period span {
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .balance-row {
      position: absolute;
      z-index: 2;
      left: 21px;
      right: 21px;
      bottom: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }
    .balance-row > div {
      display: grid;
      grid-template-columns: 29px 1fr;
      column-gap: 8px;
      align-items: center;
    }
    .metric-icon {
      grid-row: 1 / 3;
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border-radius: 9px;
    }
    .metric-icon.income {
      color: #a2f1d7;
      background: rgba(79, 226, 175, 0.15);
    }
    .metric-icon.expense {
      color: #ffc1bd;
      background: rgba(255, 141, 135, 0.14);
    }
    .balance-row p {
      margin: 0;
      color: #d7d3fb;
      font-size: 10px;
    }
    .balance-row strong {
      margin-top: 2px;
      font: 700 12px "Manrope", sans-serif;
      white-space: nowrap;
    }
    .glow {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      pointer-events: none;
    }
    .glow.one {
      width: 230px;
      height: 230px;
      right: -90px;
      top: -80px;
    }
    .glow.two {
      width: 150px;
      height: 150px;
      right: -15px;
      top: -45px;
    }
    .quick-section {
      margin: 19px 2px 22px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .quick-section button {
      min-width: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      border: 0;
      background: transparent;
    }
    .quick-section strong {
      font-size: 11px;
      font-weight: 600;
      color: #eeeef5;
    }
    .action-icon {
      width: 47px;
      height: 47px;
      display: grid;
      place-items: center;
      border-radius: 15px;
    }
    .action-icon.rose, .transaction-icon.rose {
      color: #ff8780;
      background: #382326;
    }
    .action-icon.green, .transaction-icon.green, .bank-icon.cash {
      color: #55d2ad;
      background: #18332e;
    }
    .action-icon.blue, .transaction-icon.blue, .bank-icon.mp {
      color: #5dc6ef;
      background: #182f3b;
    }
    .action-icon.amber, .transaction-icon.amber {
      color: #f0bd62;
      background: #352c1d;
    }
    .transaction-icon.violet, .bank-icon.macro {
      color: #9c91ff;
      background: #292544;
    }
    .budget-card,
    .transactions-card,
    .analytics-card,
    .categories-card {
      margin-top: 14px;
      padding: 19px;
      border: 1px solid #252834;
      border-radius: 19px;
      background: #151821;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.13);
    }
    .section-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .overline {
      color: #9999a9;
      font-size: 9px;
      letter-spacing: 1.15px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .section-top h2 {
      margin: 3px 0 0;
      font: 700 16px "Manrope", sans-serif;
      letter-spacing: -0.3px;
      color: #f4f3fa;
    }
    .section-top button {
      padding: 6px;
      border: 0;
      color: #a9aaba;
      background: transparent;
    }
    .budget-copy {
      margin: 17px 0 9px;
      display: flex;
      justify-content: space-between;
      color: #9294a5;
      font-size: 11px;
    }
    .budget-copy strong {
      color: #9c91ff;
    }
    .progress {
      height: 8px;
      overflow: hidden;
      border-radius: 8px;
      background: #292c38;
    }
    .progress i {
      display: block;
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--purple), #8d82f6);
      transition: width 0.35s ease;
    }
    .budget-card small {
      display: block;
      margin-top: 10px;
      color: #a0a0ad;
      font-size: 10px;
    }
    .budget-subpills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .budget-subpills span {
      padding: 4px 8px;
      border-radius: 8px;
      background: #1d202c;
      border: 1px solid #292d3e;
      font-size: 9.5px;
      color: #b8b9c8;
    }
    .transactions-card {
      padding-bottom: 6px;
    }
    .see-all {
      color: #9c91ff !important;
      font-size: 11px;
      font-weight: 700;
    }
    .transaction-list {
      margin-top: 10px;
    }
    .transaction {
      min-height: 64px;
      padding: 8px 0;
      display: grid;
      grid-template-columns: 40px 1fr auto;
      gap: 11px;
      align-items: center;
      border-top: 1px solid #272a35;
    }
    .transaction:first-child {
      border-top: 0;
    }
    .transaction-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 13px;
    }
    .transaction div {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .transaction strong {
      overflow: hidden;
      font-size: 12px;
      font-weight: 600;
      color: #eeeef5;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .transaction small {
      margin-top: 3px;
      color: #9292a0;
      font-size: 9.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .transaction b {
      font: 700 11px "Manrope", sans-serif;
      color: #f4f3fa;
      white-space: nowrap;
    }
    .transaction b.positive {
      color: #55d2ad;
    }
    .transaction b.transfer-amt {
      color: #5dc6ef;
    }
    .transaction {
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .transaction:active {
      background: rgba(255, 255, 255, 0.03);
    }
    .transaction.rapido-row {
      background: linear-gradient(90deg, rgba(240, 189, 98, 0.16), rgba(240, 189, 98, 0.05));
      margin: 4px -10px;
      padding: 6px 10px;
      border-radius: 13px;
      border-left: 3.5px solid #f0bd62;
      box-shadow: inset 0 0 0 1px rgba(240, 189, 98, 0.25);
    }
    .tx-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .tx-title-row strong {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge-rapido {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: 9px;
      background: rgba(240, 189, 98, 0.25);
      border: 1px solid rgba(240, 189, 98, 0.65);
      color: #ffd479;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.2px;
      box-shadow: 0 2px 8px rgba(240, 189, 98, 0.22);
    }
    .cat-combo {
      position: relative;
      width: 100%;
    }
    .cat-combo-box {
      display: flex;
      align-items: center;
      border: 1px solid #30333f;
      border-radius: 11px;
      background: #1c1f29;
      overflow: hidden;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .cat-combo-box:focus-within {
      border-color: #7769ef;
      box-shadow: 0 0 0 3px rgba(103, 88, 232, 0.18);
    }
    .cat-combo-box input {
      flex: 1;
      min-width: 0;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      height: 44px;
      padding: 0 12px;
      color: #f4f3fa;
      font-size: 12px;
    }
    .cat-combo-toggle {
      width: 40px;
      height: 44px;
      border: 0;
      border-left: 1px solid #2b2e3b;
      background: #232634;
      color: #b8b9c9;
      font-size: 13px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .cat-combo-menu {
      display: none;
      margin-top: 6px;
      max-height: 195px;
      overflow-y: auto;
      border: 1px solid #34384a;
      border-radius: 12px;
      background: #181b26;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      padding: 5px;
    }
    .cat-combo-menu.open {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cat-combo-opt {
      width: 100%;
      padding: 9px 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #d7d8e5;
      font-size: 11.5px;
      font-weight: 600;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cat-combo-opt:active,
    .cat-combo-opt.active {
      background: rgba(102, 87, 232, 0.24);
      color: #fff;
    }
    .cat-combo-opt.cat-combo-create {
      border-top: 1px dashed #2e3244;
      margin-top: 3px;
      color: #55d2ad;
    }
    .mes-selector-bar {
      margin: 4px 0 12px;
      padding: 7px 10px;
      border-radius: 15px;
      background: linear-gradient(135deg, #1b1e2b, #232738);
      border: 1px solid #32374f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    }
    .mes-nav-btn {
      width: 34px;
      height: 34px;
      border: 1px solid #353a52;
      border-radius: 10px;
      background: #161924;
      color: #d5d6e6;
      font-size: 13px;
      font-weight: 800;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .mes-center-btn {
      flex: 1;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: rgba(102, 87, 232, 0.2);
      color: #f4f3fa;
      font: 700 12px "Manrope", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .card-summary-list {
      margin: 6px 0;
      max-height: 185px;
      overflow-y: auto;
      padding: 8px 12px;
      border-radius: 13px;
      background: #181b26;
      border: 1px solid #2b2f40;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .card-summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      padding-bottom: 6px;
      border-bottom: 1px solid #232634;
    }
    .card-summary-row:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }
    .btn-card-resumen {
      padding: 5px 10px;
      border-radius: 9px;
      border: 1px solid rgba(240, 189, 98, 0.45);
      background: rgba(240, 189, 98, 0.14);
      color: #f0bd62;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .rapido-banner {
      margin: 12px 0 4px;
      padding: 11px 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(61, 47, 24, 0.85), rgba(40, 32, 22, 0.92));
      border: 1px solid rgba(240, 189, 98, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #f6d38b;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-delete-mov {
      height: 44px;
      margin-top: 4px;
      border: 1px solid rgba(238, 110, 104, 0.4);
      border-radius: 13px;
      background: rgba(56, 35, 38, 0.65);
      color: #ff8780;
      font-size: 11.5px;
      font-weight: 700;
    }
    .bottom-nav {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 76px;
      padding: 9px 13px max(9px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid #252733;
      background: rgba(18, 20, 29, 0.97);
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.22);
      transform: translateX(-50%);
      backdrop-filter: blur(16px);
    }
    .bottom-nav button {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 0;
      color: #9a9aa8;
      background: transparent;
      font-size: 9.5px;
      font-weight: 600;
    }
    .bottom-nav button.active {
      color: #9c91ff;
    }
    .bottom-nav button.active::before {
      content: "";
      position: absolute;
      top: -9px;
      width: 26px;
      height: 2.5px;
      border-radius: 5px;
      background: var(--purple);
    }
    .fab {
      position: fixed;
      z-index: 24;
      right: 16px;
      bottom: 88px;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 4px solid #0d0f16;
      border-radius: 18px;
      color: white;
      background: linear-gradient(145deg, #796af2, #5848d5);
      box-shadow: 0 10px 24px rgba(58, 44, 178, 0.48);
    }
    .page-title {
      padding: 11px 3px 14px;
    }
    .page-title h1 {
      margin: 3px 0 4px;
      font: 700 26px "Manrope", sans-serif;
      letter-spacing: -0.7px;
    }
    .page-title p {
      margin: 0;
      color: var(--muted);
      font-size: 11.5px;
    }
    .search {
      height: 46px;
      margin: 6px 0 12px;
      padding: 0 13px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid #252834;
      border-radius: 14px;
      color: #a9aaba;
      background: #151821;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.13);
    }
    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      color: #f4f3fa;
      background: transparent;
      font-size: 12px;
    }
    .search input::placeholder {
      color: #727584;
    }
    .search button {
      padding: 4px;
      border: 0;
      color: #9999a7;
      background: transparent;
    }
    .filter-chips {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar {
      display: none;
    }
    .filter-chips button {
      flex-shrink: 0;
      padding: 8px 15px;
      border: 1px solid #252834;
      border-radius: 20px;
      color: #9294a5;
      background: #151821;
      font-size: 10px;
      font-weight: 600;
    }
    .filter-chips button.active {
      color: #fff;
      border-color: var(--purple);
      background: var(--purple);
    }
    .date-label {
      margin: 0 3px 6px;
      color: #9b9baa;
      font-size: 9px;
      letter-spacing: 1px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .page-section > .transaction-list {
      padding: 5px 16px;
      border: 1px solid #252834;
      border-radius: 18px;
      background: #151821;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.13);
    }
    .day-group {
      margin-bottom: 14px;
      border: 1px solid #252834;
      border-radius: 18px;
      background: #151821;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.14);
      overflow: hidden;
    }

    function getNowDateTimeLocalIso() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      return `${y}-${m}-${d}T${hh}:${mm}`;
    }

    function getFilteredCuentasForMetodo(cuentas, metodo) {
      const all = cuentas || [];
      if (metodo === 'tarjeta') {
        const cards = all.filter(c => c.tipo === 'tarjeta');
        const others = all.filter(c => c.tipo !== 'tarjeta');
        return cards.length ? cards : others;
      }
      const wallets = all.filter(c => c.tipo !== 'tarjeta');
      return wallets.length ? wallets : all;
    }

    // Sincronizar con query params o AndroidBridge si está presente
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const qBudgetId = Number(urlParams.get('presupuesto_id'));
      if (qBudgetId > 0) {
        state.selectedBudgetId = qBudgetId;
        localStorage.setItem('gastos_selected_budget_id', String(qBudgetId));
      }
      if (window.AndroidBridge && typeof window.AndroidBridge.getToken === 'function') {
        const nativeToken = window.AndroidBridge.getToken();
        if (nativeToken) {
          state.token = nativeToken;
          localStorage.setItem('gastos_api_token', nativeToken);
        }
      }
      if (!qBudgetId && window.AndroidBridge && typeof window.AndroidBridge.getSelectedBudgetId === 'function') {
        const nativeBId = Number(window.AndroidBridge.getSelectedBudgetId());
        if (nativeBId > 0) {
          state.selectedBudgetId = nativeBId;
          localStorage.setItem('gastos_selected_budget_id', String(nativeBId));
        }
      }
    } catch (e) {}

    function showToast(msg) {
      const el = document.getElementById('toastEl');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    async function apiFetch(path, options = {}) {
      const headers = Object.assign({ 'Accept': 'application/json' }, options.headers || {});
      if (state.token) {
        headers['Authorization'] = `Bearer ${state.token}`;
      }
      if (options.body && typeof options.body === 'object') {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
      }
      const res = await fetch(path, Object.assign({}, options, {
        headers,
        credentials: 'include'
      }));
      const json = await res.json().catch(() => ({}));
      return { status: res.status, ok: res.ok, data: json };
    }

    async function ensureTokenOrLoad() {
      state.loading = true;
      render();
      if (!state.token) {
        // Intentar recuperar token de sesión activa si existe cookie
        const tokRes = await apiFetch('/api/auth/token/');
        if (tokRes.ok && tokRes.data && tokRes.data.token) {
          state.token = tokRes.data.token;
          localStorage.setItem('gastos_api_token', state.token);
          if (window.AndroidBridge && window.AndroidBridge.onTokenReceived) {
            window.AndroidBridge.onTokenReceived(state.token, tokRes.data.username || '');
          }
        }
      }
      await loadBudgetDetail(state.selectedBudgetId);
    }

    async function loadBudgetDetail(budgetId, cicloId = 0, mesYm = null) {
      state.loading = true;
      if (mesYm !== null) {
        state.selectedMesYm = mesYm;
      }
      render();
      const base = budgetId && budgetId > 0
        ? `/api/presupuestos/${budgetId}/detalle/`
        : `/api/presupuestos/activo/detalle/`;
      const qParams = [];
      if (cicloId && cicloId > 0) qParams.push(`ciclo_id=${encodeURIComponent(cicloId)}`);
      if (state.selectedMesYm) qParams.push(`mes=${encodeURIComponent(state.selectedMesYm)}`);
      const url = qParams.length ? `${base}?${qParams.join('&')}` : base;
      const res = await apiFetch(url);
      if (res.status === 401 || res.status === 403) {
        state.needsLogin = true;
        state.loading = false;
        render();
        return;
      }
      if (res.ok && res.data && res.data.success) {
        state.needsLogin = false;
        state.data = res.data;
        if (res.data.mes_info && res.data.mes_info.mes_seleccionado) {
          state.selectedMesYm = res.data.mes_info.mes_seleccionado;
        }
        if (res.data.presupuesto && res.data.presupuesto.id) {
          const p = res.data.presupuesto;
          state.selectedBudgetId = p.id;
          localStorage.setItem('gastos_selected_budget_id', String(p.id));
          try {
            if (window.AndroidBridge && typeof window.AndroidBridge.onBudgetSelected === 'function') {
              window.AndroidBridge.onBudgetSelected(
                p.id,
                p.nombre,
                Number(p.monto_restante) || 0,
                Number(p.disponible) || 0,
                Number(p.porcentaje_gastado) || 0
              );
            }
          } catch (e) {}
        }
      }
      state.loading = false;
      render();
    }

    function selectBudget(id) {
      state.selectedBudgetId = Number(id);
      state.selectedCicloId = 0;
      state.selectedMesYm = '';
      localStorage.setItem('gastos_selected_budget_id', String(id));
      state.sheet = null;
      state.movFilter = 'Todos';
      loadBudgetDetail(state.selectedBudgetId, 0, '');
    }

    function getDefaultCuentaForMetodo(metodo) {
      const cuentas = (state.data && state.data.cuentas_disponibles) || [];
      if (!cuentas.length || metodo === 'efectivo') return '';
      if (metodo === 'tarjeta') {
        const tarj = cuentas.find(c => c.tipo === 'tarjeta');
        return tarj ? tarj.nombre : cuentas[0].nombre;
      }
      const fav = cuentas.find(c => c.es_favorita && c.tipo !== 'tarjeta');
      if (fav) return fav.nombre;
      const nonCard = cuentas.find(c => c.tipo !== 'tarjeta');
      return nonCard ? nonCard.nombre : cuentas[0].nombre;
    }

    function openSheet(name, extra = null) {
      if (name === 'prestamo_nueva_tarjeta') {
        state.editingTarjetaPrestamo = null;
      }
      state.sheetNoAnim = false;
      state.sheet = name;
      const nowDateTimeIso = getNowDateTimeLocalIso();
      state.formDraft = {
        monto: '',
        nombre: '',
        fecha: nowDateTimeIso,
        persona_extra: '',
        nota: '',
        origen_cuenta: '',
        destino_cuenta: '',
        cuenta_nombre: '',
        cuenta_saldo_inicial: '',
        cuenta_es_favorita: false,
        fecha_cierre: '',
        fecha_vencimiento: '',
      };
      if (name === 'gasto') {
        state.gastoMetodo = 'transferencia';
        state.gastoCuenta = getDefaultCuentaForMetodo('transferencia');
        state.gastoCategoria = '';
        state.gastoPersonas = [];
        state.gastoCuotas = 1;
        state.gastoCuotaInicial = 1;
        state.gastoModoCuotas = 'cuota';
      } else if (name === 'ingreso') {
        state.ingresoTipo = 'transferencia';
        state.ingresoCuenta = getDefaultCuentaForMetodo('transferencia');
      } else if (name === 'transferencia') {
        state.transModo = 'efectivo_a_cuenta';
        state.formDraft.destino_cuenta = getDefaultCuentaForMetodo('transferencia');
      } else if (name === 'cuenta') {
        state.editingCuentaObj = null;
        state.cuentaTipo = (extra && extra.tipo) ? extra.tipo : 'billetera';
      } else if (name === 'resumen_tarjeta') {
        const allItems = (state.data && state.data.cuentas && state.data.cuentas.items) || [];
        const cardItems = allItems.filter(c => c.tipo === 'tarjeta' && !c.is_system);
        const cardVence = cardItems.find(c => c.vence_en_mes);
        state.resumenTarjetaNombre = (extra && extra.tarjetaNombre) || (cardVence ? cardVence.name : (cardItems[0] ? cardItems[0].name : ''));
        const foundCard = cardItems.find(c => c.name === state.resumenTarjetaNombre);
        const resT = foundCard && foundCard.resumen_tarjeta;
        if (extra && extra.periodo) {
          state.resumenTarjetaPeriodo = extra.periodo;
        } else if (foundCard && foundCard.vence_en_mes) {
          state.resumenTarjetaPeriodo = 'actual';
        } else if (resT && resT.total_mes_actual > 0) {
          state.resumenTarjetaPeriodo = 'actual';
        } else if (resT && resT.total_mes_siguiente > 0) {
          state.resumenTarjetaPeriodo = 'siguiente';
        } else if (resT && resT.total_mes_subsiguiente > 0) {
          state.resumenTarjetaPeriodo = 'subsiguiente';
        } else if (resT && resT.total_mes_anterior > 0) {
          state.resumenTarjetaPeriodo = 'anterior';
        } else {
          state.resumenTarjetaPeriodo = 'actual';
        }
        state.resumenTarjetaMetodoPago = 'transferencia';
        state.resumenTarjetaCuentaPago = getDefaultCuentaForMetodo('transferencia');
        state.resumenDiferenciaMonto = '';
        state.resumenDiferenciaConcepto = 'Impuestos y sellos resumen';
      } else if (name === 'editar_presupuesto') {
        const todayDate = new Date();
        const y = todayDate.getFullYear();
        const m = String(todayDate.getMonth() + 1).padStart(2, '0');
        const lastDay = new Date(y, todayDate.getMonth() + 1, 0).getDate();
        const edP = (extra && extra.presupuesto) || null;
        state.editingPresupuesto = edP;
        state.presupuestoTipo = edP ? (edP.tipo || 'abierto') : 'abierto';
        state.presupuestoMoneda = edP ? (edP.moneda || 'ARS') : 'ARS';
        state.confirmDeletePresupuesto = false;
        state.formDraft.p_nombre = edP ? (edP.nombre || '') : '';
        state.formDraft.p_monto_total = edP ? String(edP.monto_total || 0) : '';
        state.formDraft.p_fecha_inicio = edP ? (edP.fecha_inicio || `${y}-${m}-01`) : `${y}-${m}-01`;
        state.formDraft.p_fecha_fin = edP ? (edP.fecha_fin || `${y}-${m}-${String(lastDay).padStart(2, '0')}`) : `${y}-${m}-${String(lastDay).padStart(2, '0')}`;
        state.formDraft.p_descripcion = edP ? (edP.descripcion || '') : '';
      } else if (name === 'calculadora_monedas') {
        state.calcFormMode = null;
        state.calcDirection = 'directa';
        loadCalculadoras();
      }
      render();
    }

    async function loadCalculadoras() {
      state.calcLoading = true;
      const res = await apiFetch('/api/calculadoras/');
      state.calcLoading = false;
      if (res.ok && res.data && res.data.success) {
        state.calculadoras = res.data.calculadoras || [];
        if (res.data.monedas && res.data.monedas.length) {
          state.calculadoraMonedas = res.data.monedas;
        }
        if (state.calculadoras.length && !state.calculadoras.some(c => c.id === state.calcSelectedId)) {
          state.calcSelectedId = state.calculadoras[0].id;
        }
      }
      if (state.sheet === 'calculadora_monedas') {
        state.sheetNoAnim = true;
        render();
      }
    }

    function getGreeting() {
      const h = new Date().getHours();
      if (h < 13) return 'Buen día,';
      if (h < 20) return 'Buenas tardes,';
      return 'Buenas noches,';
    }

    function buildDonutGradient(cats) {
      if (!cats || !cats.length) {
        return 'conic-gradient(#292c38 0 100%)';
      }
      let acc = 0;
      const stops = [];
      cats.forEach((c, idx) => {
        const start = acc;
        const pct = idx === cats.length - 1 ? Math.max(0, 100 - acc) : Math.max(1, c.percent);
        const end = Math.min(100, start + pct);
        stops.push(`${c.color} ${start}% ${end}%`);
        acc = end;
      });
      return `conic-gradient(${stops.join(', ')})`;
    }

    function renderSingleTransactionArticle(item) {
      const isCardExpense = item.tipo_movimiento === 'gasto' && item.metodo_pago === 'tarjeta';
      const isPos = item.amount > 0 && !item.is_transfer;
      const sign = item.is_transfer ? '⇄ ' : (item.amount > 0 ? '+' : '−');
      const cls = item.is_transfer ? 'transfer-amt' : (isCardExpense ? 'card-amt' : (isPos ? 'positive' : ''));
      const cleanTitle = (item.title || '').replace(/^⚡\s*/, '');
      const cardBadgeText = isCardExpense
        ? (item.es_ajuste_tarjeta
            ? '💳 Ajuste resumen'
            : (item.mes_resumen_label
                ? `💳 ${item.es_post_cierre ? 'Post-cierre · ' : ''}Pasa a ${item.mes_resumen_label}`
                : '💳 Tarjeta'))
        : '';
      return `<article class="transaction ${item.es_rapido ? 'rapido-row' : ''}" data-edit-mov="${escapeHtml(item.uid)}" title="Toca para editar o eliminar">
        <span class="transaction-icon ${escapeHtml(item.tone)}">
          ${iconSvg(item.icon, 20)}
        </span>
        <div>
          <div class="tx-title-row">
            <strong>${escapeHtml(cleanTitle)}</strong>
            ${item.es_rapido ? `<span class="badge-rapido">⚡ Modificar</span>` : ''}
            ${isCardExpense ? `<span class="badge-tarjeta-info">${escapeHtml(cardBadgeText)}</span>` : ''}
          </div>
          <small>${escapeHtml(item.detail)}${item.es_rapido ? ' · Cargado rápido (tocá para completar)' : ''}</small>
        </div>
        <div style="text-align:right;">
          <b class="${cls}">${sign}${money(Math.abs(item.amount))}</b>
          ${isCardExpense ? `<small style="display:block;font-size:8px;color:#c99c4e;margin-top:2px;">No suma al día</small>` : ''}
        </div>
      </article>`;
    }

      if (!items || !items.length) {

      return `<div class="transaction-list">
        ${items.map(item => renderSingleTransactionArticle(item)).join('')}

    function formatFechaDiaHeader(fechaIso) {
      if (!fechaIso || !/^\d{4}-\d{2}-\d{2}$/.test(fechaIso)) {
        return { prefix: '', label: fechaIso || 'Sin fecha' };
      }
      const [y, m, d] = fechaIso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const now = new Date();
      const todayIso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const yest = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
      const yesterdayIso = `${yest.getFullYear()}-${String(yest.getMonth() + 1).padStart(2, '0')}-${String(yest.getDate()).padStart(2, '0')}`;

      const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const diaNombre = dias[dt.getDay()] || '';
      const mesNombre = meses[dt.getMonth()] || '';
      const label = `${diaNombre} ${d} de ${mesNombre}`;

      if (fechaIso === todayIso) return { prefix: 'HOY', label };
      if (fechaIso === yesterdayIso) return { prefix: 'AYER', label };
      return { prefix: '', label };
    }

    function renderTransactionsByDayHtml(items, isPrestamo = false) {
      if (!items || !items.length) {
        return `<div class="empty">No encontramos movimientos en este presupuesto.</div>`;
      }
      const groups = [];
      const groupMap = {};
      items.forEach(item => {
        const key = item.fecha_iso || 'sin-fecha';
        if (!groupMap[key]) {
          groupMap[key] = { fechaIso: key, list: [] };
          groups.push(groupMap[key]);
        }
        groupMap[key].list.push(item);
      });

      return groups.map(group => {
        const hdr = formatFechaDiaHeader(group.fechaIso);
        let gastosDiaSinTarjeta = 0;
        let gastosTarjetaDia = 0;
        let ingresosDia = 0;

        group.list.forEach(m => {
          const val = Math.abs(Number(m.amount) || 0);
          if (m.tipo_movimiento === 'gasto') {
            if (m.metodo_pago === 'tarjeta') {
              gastosTarjetaDia += val;
            } else {
              gastosDiaSinTarjeta += val;
            }
          } else if (m.tipo_movimiento === 'ingreso' || m.tipo_movimiento === 'aporte_efectivo') {
            ingresosDia += val;
          }
        });

        const saldoDia = ingresosDia - gastosDiaSinTarjeta;
        const saldoSign = saldoDia > 0 ? '+' : (saldoDia < 0 ? '−' : '');
        const saldoCls = saldoDia > 0 ? 'pos' : (saldoDia < 0 ? 'neg' : '');

        return `
          <div class="day-group">
            <div class="day-group-header">
              <div class="day-group-title">
                ${hdr.prefix ? `<span class="day-badge-rel">${hdr.prefix}</span>` : ''}
                <strong>${escapeHtml(hdr.label)}</strong>
                <small>(${group.list.length})</small>
              </div>
              ${!isPrestamo ? `
                <span style="font:700 10.5px 'Manrope',sans-serif;color:${saldoDia > 0 ? '#55d2ad' : (saldoDia < 0 ? '#ff8780' : '#9b9baa')};">
                  ${saldoSign}${money(Math.abs(saldoDia))}
                </span>
              ` : ''}
            </div>
            <div class="transaction-list">
              ${group.list.map(item => renderSingleTransactionArticle(item)).join('')}
            </div>
            ${!isPrestamo ? `
              <div class="day-subtotal-bar">
                <div class="day-subtotal-grid">
                  <div class="day-subtotal-col">
                    <span>Gastos (sin tarj.)</span>
                    <strong class="${gastosDiaSinTarjeta > 0 ? 'neg' : ''}">−${money(gastosDiaSinTarjeta)}</strong>
                  </div>
                  <div class="day-subtotal-col">
                    <span>Ingresos</span>
                    <strong class="${ingresosDia > 0 ? 'pos' : ''}">+${money(ingresosDia)}</strong>
                  </div>
                  <div class="day-subtotal-col">
                    <span>Subtotal día</span>
                    <strong class="${saldoCls}">${saldoSign}${money(Math.abs(saldoDia))}</strong>
                  </div>
                </div>
                ${gastosTarjetaDia > 0 ? `
                  <div class="day-card-note">
                    <span>💳 Gastos con tarjeta del día (no incluidos en subtotal)</span>
                    <b>−${money(gastosTarjetaDia)}</b>
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

        if (state.movFilter === 'Transferencias' && m.tipo_movimiento !== 'transferencia') return false;
        if (state.movFilter === 'Tarjetas' && m.tipo_movimiento !== 'extraccion_tarjeta') return false;
        if (state.movFilter === 'Efectivo' && m.tipo_movimiento !== 'aporte_efectivo') return false;
        if (state.movFilter === 'Diferencias' && m.tipo_movimiento !== 'diferencia_tarjeta') return false;
        if (state.movFilter.startsWith('Cuenta:')) {
          const targetC = state.movFilter.slice(7).toLowerCase();
          if ((m.cuenta || '').toLowerCase() !== targetC && !(m.detail || '').toLowerCase().includes(targetC)) return false;
        }
        if (state.movFilter.startsWith('Persona:')) {
          const targetP = state.movFilter.slice(8).toLowerCase();
          const parts = (m.persona || '').toLowerCase().split(',').map(s => s.trim());
          if (!parts.includes(targetP)) return false;
        }
        if (!q) return true;
        return (
          (m.title || '').toLowerCase().includes(q) ||
          (m.detail || '').toLowerCase().includes(q) ||
          (m.persona || '').toLowerCase().includes(q) ||
          (m.cuenta || '').toLowerCase().includes(q)
        );
      });

      const personas = (d.personas_disponibles || []).slice(0, 6);
      const baseFilters = isPrestamo

            ${tarjetasPrestamo.map(t => {
              const key = `Cuenta:${t.nombre}`;
              return `<button type="button" class="${state.movFilter === key ? 'active' : ''}" data-mov-filter="${escapeHtml(key)}">💳 ${escapeHtml(t.nombre)}</button>`;
            }).join('')}
            ${state.movFilter.startsWith('Cuenta:') && !tarjetasPrestamo.some(t => `Cuenta:${t.nombre}` === state.movFilter) ? `
              <button type="button" class="active" data-mov-filter="Todos">🏦 ${escapeHtml(state.movFilter.slice(7))} ✕</button>

            ${!isPrestamo ? personas.map(pers => {

              return `<button type="button" class="${state.movFilter === key ? 'active' : ''}" data-mov-filter="${escapeHtml(key)}">👤 ${escapeHtml(pers)}</button>`;

          <div class="date-label">${escapeHtml(isPrestamo && d.prestamo_info && d.prestamo_info.ciclo_actual ? d.prestamo_info.ciclo_actual.nombre : (p ? p.mes_label : ''))} (${filtered.length})</div>
          ${renderTransactionsByDayHtml(filtered, isPrestamo)}
          ${(!isPrestamo && d.mes_info && d.mes_info.mes_seleccionado !== 'todos' && (d.mes_info.total_origen_pasa_siguiente > 0 || d.mes_info.total_origen_pasa_subsiguiente > 0)) ? `

              <span class="overline" style="color:#a99fff;">RESUMEN TARJETA DE ${escapeHtml((d.mes_info.mes_label || '').toUpperCase())}</span>
              <strong style="display:block;font-size:12.5px;color:#eeeef6;margin:2px 0 8px;">A qué resumen pasa cada compra según la fecha de cierre</strong>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${d.mes_info.total_origen_pasa_siguiente > 0 ? `
                  <button type="button" class="btn-card-resumen" data-select-mes="${escapeHtml(d.mes_info.mes_siguiente)}">
                    ➔ Pasa a ${escapeHtml(d.mes_info.mes_siguiente_label)}: −${money(d.mes_info.total_origen_pasa_siguiente)}
                  </button>
                ` : ''}
                ${d.mes_info.total_origen_pasa_subsiguiente > 0 ? `
                  <button type="button" class="btn-card-resumen" data-select-mes="${escapeHtml(d.mes_info.mes_subsiguiente)}">
                    ⏭️ Post-cierre ➔ ${escapeHtml(d.mes_info.mes_subsiguiente_label)}: −${money(d.mes_info.total_origen_pasa_subsiguiente)}

              </div>
            </div>
          ` : ''}
        </section>
      `;

                extraNotes.push(`⏭️ Post-cierre ➔ ${resT.mes_subsiguiente_label}: −${money(resT.total_mes_subsiguiente)}`);

    function getResumenPeriodoData(resT, periodo) {
      const r = resT || {};
      if (periodo === 'siguiente') {
        return {
          ym: r.mes_siguiente_ym || '',
          label: r.mes_siguiente_label || 'Mes siguiente',
          total: Number(r.total_mes_siguiente) || 0,
          consumos: r.consumos_mes_siguiente || [],
        };
      }
      if (periodo === 'subsiguiente') {
        return {
          ym: r.mes_subsiguiente_ym || '',
          label: r.mes_subsiguiente_label || 'Mes subsiguiente',
          total: Number(r.total_mes_subsiguiente) || 0,
          consumos: r.consumos_mes_subsiguiente || [],
        };
      }
      if (periodo === 'anterior') {
        return {
          ym: r.mes_anterior_ym || '',
          label: r.mes_anterior_label || 'Mes anterior',
          total: Number(r.total_mes_anterior) || 0,
          consumos: r.consumos_mes_anterior || [],
        };
      }
      return {
        ym: r.mes_actual_ym || '',
        label: r.mes_actual_label || 'Mes actual',
        total: Number(r.total_mes_actual) || 0,
        consumos: r.consumos_mes_actual || [],

                  </button>

              </form>
            </div>

      if (state.sheet === 'calculadora_monedas') {
        const calcs = state.calculadoras || [];
        const curCalc = calcs.find(c => c.id === state.calcSelectedId) || calcs[0] || null;
        const monedasList = state.calculadoraMonedas || [];
        const montoNum = parseFloat(String(state.calcMonto || '0').replace(',', '.')) || 0;
        const isInv = state.calcDirection === 'inversa';
        let resConv = 0;
        let origCode = curCalc ? (isInv ? curCalc.moneda_destino : curCalc.moneda_origen) : 'USD';
        let destCode = curCalc ? (isInv ? curCalc.moneda_origen : curCalc.moneda_destino) : 'ARS';
        let tasaDisplay = '';
        if (curCalc && curCalc.relacion > 0) {
          if (isInv) {
            resConv = montoNum / curCalc.relacion;
            tasaDisplay = `1 ${origCode} = ${(1 / curCalc.relacion).toFixed(6)} ${destCode}`;
          } else {
            resConv = montoNum * curCalc.relacion;
            tasaDisplay = `1 ${origCode} = ${Number(curCalc.relacion).toLocaleString('es-AR', { maximumFractionDigits: 4 })} ${destCode}`;
          }
        }
        const showForm = state.calcFormMode === 'new' || state.calcFormMode === 'edit' || (!state.calcLoading && !calcs.length);

        return `

                    </div>
                    ${edCalc ? `
                      <button type="button" class="btn-delete-mov" id="btnDeleteCalc" style="margin-top:8px;">

                      </button>

    function render() {
      const root = document.getElementById('appRoot');
      if (!root) return;

      const hasSheet = Boolean(state.sheet) && !state.needsLogin;
      document.documentElement.classList.toggle('sheet-open', hasSheet);
      document.body.classList.toggle('sheet-open', hasSheet);

      if (state.needsLogin) {
        root.innerHTML = renderLogin();
        bindEvents();
        return;
      }

      const d = state.data;
      const u = (d && d.user) || { display_name: 'Usuario', initials: 'US' };
      const p = d ? d.presupuesto : null;

      let screenContent = '';
      if (state.loading && !d) {
        screenContent = `<div class="empty" style="padding-top:90px;">Cargando tu información financiera...</div>`;
      } else if (d) {
        if (state.tab === 'Inicio') screenContent = renderInicio(d);
        else if (state.tab === 'Movimientos') screenContent = renderMovimientos(d);
        else if (state.tab === 'Análisis') screenContent = renderAnalisis(d);
        else if (state.tab === 'Cuentas') screenContent = renderCuentas(d);
      }

      const navItems = [
        { label: 'Inicio', icon: 'home' },
        { label: 'Movimientos', icon: 'activity' },
        { label: 'Análisis', icon: 'chart' },
        { label: 'Cuentas', icon: 'wallet' },
      ];

      root.innerHTML = `
        <header class="app-header">
          <div class="hello">
            <div class="avatar">${escapeHtml(u.initials || 'US')}</div>
            <div class="hello-text">
              <span>${getGreeting()}</span>
              <strong>${escapeHtml(u.display_name || 'Usuario')}</strong>
            </div>
          </div>
          <div class="header-actions">
            <button type="button" class="budget-selector-pill" data-open-sheet="presupuesto" title="Elegir presupuesto">
              ${iconSvg('calendar', 14)}
              <span>${escapeHtml(p ? p.nombre : 'Presupuesto')}</span>
              ${iconSvg('chevron', 13)}
            </button>
            <button type="button" class="header-icon" id="btnHeaderWeb" aria-label="Versión web completa" title="Abrir vista web clásica">
              ${iconSvg('more', 20)}
            </button>
          </div>
        </header>

        <main class="screen">
          ${screenContent}
        </main>

        <nav class="bottom-nav">
          ${navItems.map(item => `
            <button type="button" class="${state.tab === item.label ? 'active' : ''}" data-switch-tab="${item.label}">
              ${iconSvg(item.icon, 22)}
              <span>${item.label}</span>
            </button>
          `).join('')}
        </nav>

        <button type="button" class="fab" data-open-sheet="menu" aria-label="Agregar movimiento">
          ${iconSvg('plus', 27)}
        </button>

        ${renderSheet(d)}
      `;

      bindEvents();
    }

    function bindEvents() {
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(loginForm);
          state.loginError = '';
          const res = await apiFetch('/api/auth/login/', {
            method: 'POST',
            body: {
              username: fd.get('username'),
              password: fd.get('password'),
              device_name: 'Android App Redesign'
            }
          });
          if (res.ok && res.data && res.data.token) {
            state.token = res.data.token;
            localStorage.setItem('gastos_api_token', state.token);
            if (window.AndroidBridge && window.AndroidBridge.onTokenReceived) {
              window.AndroidBridge.onTokenReceived(state.token, res.data.username || '');
            }
            state.needsLogin = false;
            await loadBudgetDetail(state.selectedBudgetId);
          } else {
            state.loginError = (res.data && res.data.error) || 'No se pudo iniciar sesión';
            render();
          }
        };

      const updateCatMenuFilter = (comboId, filterText) => {
        const menu = document.getElementById(`${comboId}Menu`);
        if (!menu) return;
        const q = (filterText || '').trim().toLowerCase();
        let exactMatch = false;
        menu.querySelectorAll('.cat-combo-opt:not(.cat-combo-create)').forEach(opt => {
          const s = (opt.getAttribute('data-cat-search') || '').toLowerCase();
          if (!q || !s || s.includes(q)) {
            opt.style.display = 'flex';
          } else {
            opt.style.display = 'none';
          }
          if (q && s === q) exactMatch = true;
        });
        const createOpt = document.getElementById(`${comboId}CreateOpt`);
        const createTxt = document.getElementById(`${comboId}CreateText`);
        if (createOpt && createTxt) {
          if (q && !exactMatch) {
            createOpt.style.display = 'flex';
            createOpt.setAttribute('data-pick-cat', filterText.trim());

          const sub = getResumenPeriodoData(resT, state.resumenTarjetaPeriodo).total;
          const dif = parseFloat(e.target.value) || 0;

          const fd = formR ? new FormData(formR) : new FormData();
          const allItems = (state.data && state.data.cuentas && state.data.cuentas.items) || [];
          const cardObj = allItems.find(c => c.name === state.resumenTarjetaNombre);
          const resT = (cardObj && cardObj.resumen_tarjeta) || {};
          const mesResumenYm = getResumenPeriodoData(resT, state.resumenTarjetaPeriodo).ym;
          const res = await apiFetch('/api/tarjetas/pagar-resumen/', {
            method: 'POST',
            body: {

          } else {

      // Submit Transferencia

          state.calcMonto = e.target.value;
          const calcs = state.calculadoras || [];
          const curCalc = calcs.find(c => c.id === state.calcSelectedId) || calcs[0] || null;
          if (!curCalc || !curCalc.relacion) return;
          const val = parseFloat(String(e.target.value || '0').replace(',', '.')) || 0;
          const isInv = state.calcDirection === 'inversa';
          const resVal = isInv ? (val / curCalc.relacion) : (val * curCalc.relacion);
          const destCode = isInv ? curCalc.moneda_origen : curCalc.moneda_destino;
          txtCalcResultado.textContent = `${destCode} ${resVal.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

              moneda_destino: fd.get('moneda_destino'),
              relacion: fd.get('relacion'),

        if (!inpMontoSacado || !inpTasaPrestamo || !inpMontoProxMes) return;

        const t = parseFloat(inpTasaPrestamo.value) || 0;
        if (m > 0) {
          inpMontoProxMes.value = (m * (1 + t / 100)).toFixed(2);
        }
      };

          } else {
            showToast((res.data && res.data.error) || 'Error al guardar');
          }
        };
      }

      const formPrestamoDiferencia = document.getElementById('formPrestamoDiferencia');
      if (formPrestamoDiferencia) {
        formPrestamoDiferencia.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formPrestamoDiferencia);
          const res = await apiFetch('/api/prestamo/diferencia/crear/', {
            method: 'POST',
            body: {
              presupuesto_id: state.selectedBudgetId,
              ciclo_id: getActiveCicloId(),
              tarjeta_id: fd.get('tarjeta_id'),
              monto: fd.get('monto'),
              concepto: fd.get('concepto'),

          });
          if (res.ok && res.data && res.data.success) {

            showToast('✓ Diferencia de tarjeta sumada al período');

          }
        };
      }

        formPrestamoGuardarTarjeta.onsubmit = async (e) => {

    // Exponer funciones globales para refrescar o abrir presupuesto directo desde Android / Widget
    window.openBudgetFromWidget = function(budgetId) {
      const bId = Number(budgetId) || (window.AndroidBridge && typeof window.AndroidBridge.getSelectedBudgetId === 'function' ? Number(window.AndroidBridge.getSelectedBudgetId()) : 0);
      if (bId > 0) {
        state.selectedBudgetId = bId;
        state.selectedCicloId = 0;
        state.sheet = null;
        state.tab = 'Inicio';
        localStorage.setItem('gastos_selected_budget_id', String(bId));
      }
      loadBudgetDetail(state.selectedBudgetId);
    };

    window.reloadAppData = function(budgetId) {
      const bId = Number(budgetId) || (window.AndroidBridge && typeof window.AndroidBridge.getSelectedBudgetId === 'function' ? Number(window.AndroidBridge.getSelectedBudgetId()) : 0);
      if (bId > 0 && bId !== state.selectedBudgetId) {
        state.selectedBudgetId = bId;
        state.selectedCicloId = 0;
        localStorage.setItem('gastos_selected_budget_id', String(bId));
      }
      loadBudgetDetail(state.selectedBudgetId, state.selectedCicloId);
    };

    ensureTokenOrLoad();
  </script>
</body>
</html>
