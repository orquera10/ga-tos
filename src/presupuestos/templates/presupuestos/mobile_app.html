                `).join('')}
              </div>
            </label>
            ${state.editMetodo !== 'efectivo' ? `
              <label>
                Cuenta / Billetera / Tarjeta
                <select name="cuenta_bancaria">
                  <option value="">Sin cuenta específica</option>
                  ${cuentas.map(c => `<option value="${escapeHtml(c.nombre)}" ${(m.cuenta_bancaria || '').toLowerCase() === c.nombre.toLowerCase() ? 'selected' : ''}>${escapeHtml(c.nombre)} (${escapeHtml(c.subtitle)})</option>`).join('')}
                </select>
              </label>
            ` : ''}
            <label>
              Personas / Tags
              <div class="chips-selector">
                ${personas.map(pers => `
                  <button type="button" class="chip-btn ${state.editPersonas.includes(pers) ? 'selected' : ''}" data-edit-toggle-persona="${escapeHtml(pers)}">👤 ${escapeHtml(pers)}</button>
                `).join('')}
              </div>
              <input name="persona" placeholder="Separados por coma (ej. Dario, Camila)" value="${escapeHtml(state.editPersonas.join(', '))}" />
            </label>
          `;
        } else if (tm === 'ingreso') {
          fieldsHtml = `
            <label>
              Monto
              <div class="amount-input">
                <span>$</span>
                <input name="monto" type="number" step="0.01" min="0.01" required value="${rawMonto}" inputmode="decimal" />
              </div>
            </label>
            <label>
              Concepto
              <input name="nombre" required value="${escapeHtml(cleanName)}" placeholder="Nombre del ingreso" />
            </label>
            <label>
              Tipo de ingreso
              <select name="tipo_ingreso" id="selectEditTipoIngreso">
                <option value="transferencia" ${state.editMetodo === 'transferencia' ? 'selected' : ''}>🏦 Transferencia</option>
                <option value="sueldo" ${state.editMetodo === 'sueldo' ? 'selected' : ''}>💼 Sueldo</option>
                <option value="efectivo" ${state.editMetodo === 'efectivo' ? 'selected' : ''}>💵 Efectivo</option>
              </select>
            </label>
            ${state.editMetodo !== 'efectivo' ? `
              <label>
                Cuenta / Billetera destino
                <select name="cuenta_bancaria">
                  <option value="">Sin cuenta específica</option>
                  ${cuentas.map(c => `<option value="${escapeHtml(c.nombre)}" ${(m.cuenta_bancaria || '').toLowerCase() === c.nombre.toLowerCase() ? 'selected' : ''}>${escapeHtml(c.nombre)} (${escapeHtml(c.subtitle)})</option>`).join('')}
                </select>
              </label>
            ` : ''}
          `;
        } else if (tm === 'transferencia') {
          fieldsHtml = `
            <label>
              Monto transferido
              <div class="amount-input">
                <span>$</span>
                <input name="monto" type="number" step="0.01" min="0.01" required value="${rawMonto}" inputmode="decimal" />
              </div>
            </label>
            <label>
              Nota
              <input name="nota" value="${escapeHtml(m.nota || '')}" placeholder="Nota de la transferencia" />
            </label>
          `;
        } else if (tm === 'extraccion_tarjeta') {
          fieldsHtml = `
            <label>
              Tarjeta utilizada
              <select name="tarjeta_id">
                ${tarjetasP.map(t => `<option value="${t.id}" ${String(m.tarjeta_id) === String(t.id) ? 'selected' : ''}>${escapeHtml(t.nombre)}</option>`).join('')}
              </select>
            </label>
            <div class="form-row">
              <label>
                Monto sacado
                <div class="amount-input">
                  <span>$</span>
                  <input name="monto" id="inpMontoSacado" type="number" step="0.01" min="1" required value="${rawMonto}" inputmode="decimal" />
                </div>
              </label>
              <label>
                Tasa interés (%)
                <input name="tasa_interes" id="inpTasaPrestamo" type="number" step="0.01" value="${m.tasa_interes || tasaP}" required />
              </label>
            </div>
            <label>
              Monto próximo mes (con interés)
              <div class="amount-input">
                <span>$</span>
                <input name="monto_proximo_mes" id="inpMontoProxMes" type="number" step="0.01" min="1" required value="${m.monto_proximo_mes || rawMonto}" inputmode="decimal" />
              </div>
            </label>
            <label>
              Concepto
              <input name="nombre" value="${escapeHtml(cleanName)}" required />
            </label>
          `;
        } else if (tm === 'aporte_efectivo') {
          fieldsHtml = `
            <label>
              Monto aportado en efectivo
              <div class="amount-input">
                <span>$</span>
                <input name="monto" type="number" step="0.01" min="1" required value="${rawMonto}" inputmode="decimal" />
              </div>
            </label>
            <label>
              Concepto
              <input name="nombre" value="${escapeHtml(cleanName)}" required />
            </label>
          `;
        } else if (tm === 'diferencia_tarjeta') {
          fieldsHtml = `
            <label>
              Tarjeta
              <select name="tarjeta_id">
                ${tarjetasP.map(t => `<option value="${t.id}" ${String(m.tarjeta_id) === String(t.id) ? 'selected' : ''}>${escapeHtml(t.nombre)}</option>`).join('')}
              </select>
            </label>
            <label>
              Monto diferencia de resumen
              <div class="amount-input">
                <span>$</span>
                <input name="monto" type="number" step="0.01" min="1" required value="${rawMonto}" inputmode="decimal" />
              </div>
            </label>
            <label>
              Concepto
              <input name="concepto" value="${escapeHtml(m.concepto || cleanName)}" required />
            </label>
          `;
        }

        return `
          <div class="sheet-backdrop" id="sheetBackdrop">
            <div class="bottom-sheet form-sheet">
              <div class="handle"></div>
              <div class="sheet-title">
                <div>
                  <span class="overline" style="${isRapido ? 'color:#f0bd62;' : ''}">${isRapido ? '⚡ CARGA RÁPIDA DEL WIDGET · COMPLETAR DATOS' : 'EDITAR O ELIMINAR MOVIMIENTO'}</span>
                  <h2>${isRapido ? 'Completar movimiento' : 'Modificar movimiento'}</h2>
                </div>
                <button type="button" data-close-sheet>${iconSvg('close', 20)}</button>
              </div>
              <form id="formEditarMov">
                ${fieldsHtml}
                <button type="submit" class="submit purple">Guardar cambios</button>
                <button type="button" class="btn-delete-mov" id="btnDeleteMov">
                  ${state.confirmDeleteMov ? '⚠️ Tocá de nuevo para confirmar eliminación' : '🗑️ Eliminar movimiento'}
                </button>
              </form>
            </div>
          </div>
        `;
      }

      return '';
    }

    function render() {
      const root = document.getElementById('appRoot');
      if (!root) return;

      if (state.needsLogin) {
        root.innerHTML = renderLogin();
        bindEvents();
        return;
      }

      const d = state.data;
      const u = (d && d.user) || { display_name: 'Usuario', initials: 'US' };
      const p = d ? d.presupuesto : null;

      let screenContent = '';
      if (state.loading && !d) {
        screenContent = `<div class="empty" style="padding-top:90px;">Cargando tu información financiera...</div>`;
      } else if (d) {
        if (state.tab === 'Inicio') screenContent = renderInicio(d);
        else if (state.tab === 'Movimientos') screenContent = renderMovimientos(d);
        else if (state.tab === 'Análisis') screenContent = renderAnalisis(d);
        else if (state.tab === 'Cuentas') screenContent = renderCuentas(d);
      }

      const navItems = [
        { label: 'Inicio', icon: 'home' },
        { label: 'Movimientos', icon: 'activity' },
        { label: 'Análisis', icon: 'chart' },
        { label: 'Cuentas', icon: 'wallet' },
      ];

      root.innerHTML = `
        <header class="app-header">
          <div class="hello">
            <div class="avatar">${escapeHtml(u.initials || 'US')}</div>
            <div class="hello-text">
              <span>${getGreeting()}</span>
              <strong>${escapeHtml(u.display_name || 'Usuario')}</strong>
            </div>
          </div>
          <div class="header-actions">
            <button type="button" class="budget-selector-pill" data-open-sheet="presupuesto" title="Elegir presupuesto">
              ${iconSvg('calendar', 14)}
              <span>${escapeHtml(p ? p.nombre : 'Presupuesto')}</span>
              ${iconSvg('chevron', 13)}
            </button>
            <button type="button" class="header-icon" id="btnHeaderWeb" aria-label="Versión web completa" title="Abrir vista web clásica">
              ${iconSvg('more', 20)}
            </button>
          </div>
        </header>

        <main class="screen">
          ${screenContent}
        </main>

        <nav class="bottom-nav">
          ${navItems.map(item => `
            <button type="button" class="${state.tab === item.label ? 'active' : ''}" data-switch-tab="${item.label}">
              ${iconSvg(item.icon, 22)}
              <span>${item.label}</span>
            </button>
          `).join('')}
        </nav>

        <button type="button" class="fab" data-open-sheet="menu" aria-label="Agregar movimiento">
          ${iconSvg('plus', 27)}
        </button>

        ${renderSheet(d)}
      `;

      bindEvents();
    }

    function bindEvents() {
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(loginForm);
          state.loginError = '';
          const res = await apiFetch('/api/auth/login/', {
            method: 'POST',
            body: {
              username: fd.get('username'),
              password: fd.get('password'),
              device_name: 'Android App Redesign'
            }
          });
          if (res.ok && res.data && res.data.token) {
            state.token = res.data.token;
            localStorage.setItem('gastos_api_token', state.token);
            if (window.AndroidBridge && window.AndroidBridge.onTokenReceived) {
              window.AndroidBridge.onTokenReceived(state.token, res.data.username || '');
            }
            state.needsLogin = false;
            await loadBudgetDetail(state.selectedBudgetId);
          } else {
            state.loginError = (res.data && res.data.error) || 'No se pudo iniciar sesión';
            render();
          }
        };
      }

      const btnToggleBalance = document.getElementById('btnToggleBalance');
      if (btnToggleBalance) {
        btnToggleBalance.onclick = () => {
          state.balanceVisible = !state.balanceVisible;
          render();
        };
      }

      document.querySelectorAll('[data-switch-tab]').forEach(btn => {
        btn.onclick = () => {
          state.tab = btn.getAttribute('data-switch-tab');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        };
      });

      document.querySelectorAll('[data-open-sheet]').forEach(btn => {
        btn.onclick = () => openSheet(btn.getAttribute('data-open-sheet'));
      });

      document.querySelectorAll('[data-close-sheet]').forEach(btn => {
        btn.onclick = () => {
          state.sheet = null;
          render();
        };
      });

      const backdrop = document.getElementById('sheetBackdrop');
      if (backdrop) {
        backdrop.onmousedown = (e) => {
          if (e.target === backdrop) {
            state.sheet = null;
            render();
          }
        };
      }

      document.querySelectorAll('[data-select-budget]').forEach(btn => {
        btn.onclick = () => selectBudget(btn.getAttribute('data-select-budget'));
      });

      document.querySelectorAll('[data-mov-filter]').forEach(btn => {
        btn.onclick = () => {
          state.movFilter = btn.getAttribute('data-mov-filter');
          render();
        };
      });

      document.querySelectorAll('[data-go-rapidos]').forEach(el => {
        el.onclick = () => {
          state.tab = 'Movimientos';
          state.movFilter = 'Rapidos';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        };
      });

      document.querySelectorAll('[data-edit-mov]').forEach(art => {
        art.onclick = () => {
          const uid = art.getAttribute('data-edit-mov');
          const allMovs = (state.data && state.data.movimientos) || [];
          const found = allMovs.find(m => m.uid === uid);
          if (found) {
            state.editingMov = found;
            state.editMetodo = found.metodo_pago || found.tipo_ingreso || 'efectivo';
            state.editPersonas = (found.persona || '').split(',').map(s => s.trim()).filter(Boolean);
            state.confirmDeleteMov = false;
            state.sheet = 'editar_mov';
            render();
          }
        };
      });

      document.querySelectorAll('[data-edit-metodo]').forEach(btn => {
        btn.onclick = () => {
          state.editMetodo = btn.getAttribute('data-edit-metodo');
          render();
        };
      });

      const selectEditTipoIngreso = document.getElementById('selectEditTipoIngreso');
      if (selectEditTipoIngreso) {
        selectEditTipoIngreso.onchange = (e) => {
          state.editMetodo = e.target.value;
          render();
        };
      }

      document.querySelectorAll('[data-edit-toggle-persona]').forEach(btn => {
        btn.onclick = () => {
          const p = btn.getAttribute('data-edit-toggle-persona');
          const idx = state.editPersonas.indexOf(p);
          if (idx >= 0) state.editPersonas.splice(idx, 1);
          else state.editPersonas.push(p);
          render();
        };
      });

      const formEditarMov = document.getElementById('formEditarMov');
      if (formEditarMov && state.editingMov) {
        formEditarMov.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formEditarMov);
          const m = state.editingMov;
          const payload = {
            id: m.id,
            tipo_movimiento: m.tipo_movimiento,
            monto: fd.get('monto'),
            nombre: fd.get('nombre') || '',
            categoria_id: fd.get('categoria_id') || null,
            metodo_pago: state.editMetodo,
            tipo_ingreso: fd.get('tipo_ingreso') || state.editMetodo,
            cuenta_bancaria: state.editMetodo === 'efectivo' ? '' : (fd.get('cuenta_bancaria') || ''),
            persona: fd.get('persona') !== null ? fd.get('persona') : state.editPersonas.join(', '),
            nota: fd.get('nota') || '',
            concepto: fd.get('concepto') || '',
            tarjeta_id: fd.get('tarjeta_id') || null,
            tasa_interes: fd.get('tasa_interes') || null,
            monto_proximo_mes: fd.get('monto_proximo_mes') || null,
          };
          const res = await apiFetch('/api/movimientos/editar/', {
            method: 'POST',
            body: payload,
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            state.editingMov = null;
            showToast('✓ Movimiento actualizado');
            await loadBudgetDetail(state.selectedBudgetId, state.selectedCicloId);
          } else {
            showToast((res.data && res.data.error) || 'Error al actualizar movimiento');
          }
        };
      }

      const btnDeleteMov = document.getElementById('btnDeleteMov');
      if (btnDeleteMov && state.editingMov) {
        btnDeleteMov.onclick = async () => {
          if (!state.confirmDeleteMov) {
            state.confirmDeleteMov = true;
            render();
            return;
          }
          const m = state.editingMov;
          const res = await apiFetch('/api/movimientos/eliminar/', {
            method: 'POST',
            body: {
              id: m.id,
              tipo_movimiento: m.tipo_movimiento,
            }
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            state.editingMov = null;
            state.confirmDeleteMov = false;
            showToast('🗑️ Movimiento eliminado');
            await loadBudgetDetail(state.selectedBudgetId, state.selectedCicloId);
          } else {
            showToast((res.data && res.data.error) || 'Error al eliminar');
          }
        };
      }

      document.querySelectorAll('[data-account-filter]').forEach(art => {
        art.onclick = () => {
          const accName = art.getAttribute('data-account-filter');
          if (accName && accName !== 'Tarjetas (Próx. mes)') {
            state.movFilter = `Cuenta:${accName}`;
            state.tab = 'Movimientos';
            render();
          }
        };
      });

      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.oninput = (e) => {
          state.query = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const nextInput = document.getElementById('searchInput');
          if (nextInput) {
            nextInput.focus();
            nextInput.setSelectionRange(pos, pos);
          }
        };
      }

      const btnClearSearch = document.getElementById('btnClearSearch');
      if (btnClearSearch) {
        btnClearSearch.onclick = () => {
          state.query = '';
          render();
        };
      }

      const btnToggleAnalisisMode = document.getElementById('btnToggleAnalisisMode');
      if (btnToggleAnalisisMode) {
        btnToggleAnalisisMode.onclick = () => {
          state.analisisMode = state.analisisMode === 'categorias' ? 'personas' : 'categorias';
          render();
        };
      }

      const openClassic = () => {
        const pId = state.selectedBudgetId;
        const target = pId > 0 ? `/presupuesto/${pId}/?classic=1` : '/presupuestos/?classic=1';
        if (window.AndroidBridge && typeof window.AndroidBridge.openClassicWeb === 'function') {
          window.AndroidBridge.openClassicWeb(target);
        } else {
          window.location.href = target;
        }
      };

      const btnHeaderWeb = document.getElementById('btnHeaderWeb');
      if (btnHeaderWeb) btnHeaderWeb.onclick = () => openSheet('presupuesto');

      const btnOpenClassicWeb = document.getElementById('btnOpenClassicWeb');
      if (btnOpenClassicWeb) btnOpenClassicWeb.onclick = openClassic;

      // Eventos dentro de hoja Gasto
      document.querySelectorAll('[data-gasto-metodo]').forEach(btn => {
        btn.onclick = () => {
          state.gastoMetodo = btn.getAttribute('data-gasto-metodo');
          render();
        };
      });

      document.querySelectorAll('[data-toggle-persona]').forEach(btn => {
        btn.onclick = () => {
          const p = btn.getAttribute('data-toggle-persona');
          const idx = state.gastoPersonas.indexOf(p);
          if (idx >= 0) state.gastoPersonas.splice(idx, 1);
          else state.gastoPersonas.push(p);
          render();
        };
      });

      const selectTipoIngreso = document.getElementById('selectTipoIngreso');
      if (selectTipoIngreso) {
        selectTipoIngreso.onchange = (e) => {
          state.ingresoTipo = e.target.value;
          render();
        };
      }

      document.querySelectorAll('[data-trans-modo]').forEach(btn => {
        btn.onclick = () => {
          state.transModo = btn.getAttribute('data-trans-modo');
          render();
        };
      });

      // Submit Gasto
      const formGasto = document.getElementById('formGasto');
      if (formGasto) {
        formGasto.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formGasto);
          const res = await apiFetch('/api/gastos/crear/', {
            method: 'POST',
            body: {
              presupuesto_id: state.selectedBudgetId,
              nombre: fd.get('nombre') || '',
              monto: fd.get('monto'),
              categoria_id: fd.get('categoria_id') || null,
              fecha: fd.get('fecha') || '',
              metodo_pago: state.gastoMetodo,
              cuenta_bancaria: state.gastoMetodo === 'efectivo' ? '' : (fd.get('cuenta_bancaria') || ''),
              persona: fd.get('persona_extra') || state.gastoPersonas.join(', '),
            }
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            showToast('✓ Gasto registrado');
            await loadBudgetDetail(state.selectedBudgetId);
          } else {
            showToast((res.data && res.data.error) || 'Error al guardar gasto');
          }
        };
      }

      // Submit Ingreso
      const formIngreso = document.getElementById('formIngreso');
      if (formIngreso) {
        formIngreso.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formIngreso);
          const tipo = fd.get('tipo_ingreso') || state.ingresoTipo;
          const res = await apiFetch('/api/ingresos/crear/', {
            method: 'POST',
            body: {
              presupuesto_id: state.selectedBudgetId,
              nombre: fd.get('nombre') || '',
              monto: fd.get('monto'),
              tipo_ingreso: tipo,
              fecha: fd.get('fecha') || '',
              cuenta_bancaria: tipo === 'efectivo' ? '' : (fd.get('cuenta_bancaria') || ''),
            }
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            showToast('✓ Ingreso registrado');
            await loadBudgetDetail(state.selectedBudgetId);
          } else {
            showToast((res.data && res.data.error) || 'Error al guardar ingreso');
          }
        };
      }

      // Submit Transferencia
      const formTransferencia = document.getElementById('formTransferencia');
      if (formTransferencia) {
        formTransferencia.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formTransferencia);
          let origen_tipo = 'efectivo';
          let destino_tipo = 'cuenta';
          if (state.transModo === 'cuenta_a_efectivo') {
            origen_tipo = 'cuenta';
            destino_tipo = 'efectivo';
          } else if (state.transModo === 'entre_cuentas') {
            origen_tipo = 'cuenta';
            destino_tipo = 'cuenta';
          }
          const res = await apiFetch('/api/transferencias/crear/', {
            method: 'POST',
            body: {
              presupuesto_id: state.selectedBudgetId,
              origen_tipo,
              origen_cuenta: fd.get('origen_cuenta') || '',
              destino_tipo,
              destino_cuenta: fd.get('destino_cuenta') || '',
              monto: fd.get('monto'),
              nota: fd.get('nota') || '',
            }
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            showToast('✓ Transferencia realizada');
            await loadBudgetDetail(state.selectedBudgetId);
          } else {
            showToast((res.data && res.data.error) || 'Error al transferir');
          }
        };
      }

      // Submit Nueva Cuenta
      const formCuenta = document.getElementById('formCuenta');
      if (formCuenta) {
        formCuenta.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formCuenta);
          const res = await apiFetch('/api/cuentas/crear/', {
            method: 'POST',
            body: {
              nombre: fd.get('nombre'),
              tipo: fd.get('tipo') || 'billetera',
              saldo_inicial: fd.get('saldo_inicial') || 0,
              presupuesto_id: state.selectedBudgetId,
            }
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            showToast('✓ Cuenta agregada');
            await loadBudgetDetail(state.selectedBudgetId, state.selectedCicloId);
          } else {
            showToast((res.data && res.data.error) || 'Error al agregar cuenta');
          }
        };
      }

      // Eventos de Préstamo
      document.querySelectorAll('[data-select-ciclo]').forEach(btn => {
        btn.onclick = () => {
          const cid = Number(btn.getAttribute('data-select-ciclo'));
          state.selectedCicloId = cid;
          state.sheet = null;
          loadBudgetDetail(state.selectedBudgetId, cid);
        };
      });

      document.querySelectorAll('[data-edit-tarjeta-prestamo]').forEach(art => {
        art.onclick = () => {
          const tid = Number(art.getAttribute('data-edit-tarjeta-prestamo'));
          const tarjetas = (state.data && state.data.prestamo_info && state.data.prestamo_info.tarjetas) || [];
          const found = tarjetas.find(t => t.id === tid);
          if (found) {
            state.editingTarjetaPrestamo = found;
            state.sheet = 'prestamo_nueva_tarjeta';
            render();
          }
        };
      });

      const inpMontoSacado = document.getElementById('inpMontoSacado');
      const inpTasaPrestamo = document.getElementById('inpTasaPrestamo');
      const inpMontoProxMes = document.getElementById('inpMontoProxMes');
      const recalcProx = () => {
        if (!inpMontoSacado || !inpTasaPrestamo || !inpMontoProxMes) return;
        const m = parseFloat(inpMontoSacado.value) || 0;
        const t = parseFloat(inpTasaPrestamo.value) || 0;
        if (m > 0) {
          inpMontoProxMes.value = (m * (1 + t / 100)).toFixed(2);
        }
      };
      if (inpMontoSacado) inpMontoSacado.oninput = recalcProx;
      if (inpTasaPrestamo) inpTasaPrestamo.oninput = recalcProx;

      const getActiveCicloId = () => {
        if (state.selectedCicloId > 0) return state.selectedCicloId;
        return (state.data && state.data.prestamo_info && state.data.prestamo_info.ciclo_actual && state.data.prestamo_info.ciclo_actual.id) || null;
      };

      const formPrestamoTarjeta = document.getElementById('formPrestamoTarjeta');
      if (formPrestamoTarjeta) {
        formPrestamoTarjeta.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formPrestamoTarjeta);
          const res = await apiFetch('/api/prestamo/ingreso/crear/', {
            method: 'POST',
            body: {
              presupuesto_id: state.selectedBudgetId,
              ciclo_id: getActiveCicloId(),
              modo: 'tarjeta',
              tarjeta_id: fd.get('tarjeta_id'),
              monto: fd.get('monto'),
              tasa_interes: fd.get('tasa_interes'),
              monto_proximo_mes: fd.get('monto_proximo_mes'),
              nombre: fd.get('nombre') || '',
            }
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            showToast('✓ Extracción con tarjeta registrada');
            await loadBudgetDetail(state.selectedBudgetId, state.selectedCicloId);
          } else {
            showToast((res.data && res.data.error) || 'Error al guardar');
          }
        };
      }

      const formPrestamoEfectivo = document.getElementById('formPrestamoEfectivo');
      if (formPrestamoEfectivo) {
        formPrestamoEfectivo.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formPrestamoEfectivo);
          const res = await apiFetch('/api/prestamo/ingreso/crear/', {
            method: 'POST',
            body: {
              presupuesto_id: state.selectedBudgetId,
              ciclo_id: getActiveCicloId(),
              modo: 'efectivo',
              monto: fd.get('monto'),
              nombre: fd.get('nombre') || 'Aporte propio en efectivo',
            }
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            showToast('✓ Aporte en efectivo registrado');
            await loadBudgetDetail(state.selectedBudgetId, state.selectedCicloId);
          } else {
            showToast((res.data && res.data.error) || 'Error al guardar');
          }
        };
      }

      const formPrestamoDiferencia = document.getElementById('formPrestamoDiferencia');
      if (formPrestamoDiferencia) {
        formPrestamoDiferencia.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formPrestamoDiferencia);
          const res = await apiFetch('/api/prestamo/diferencia/crear/', {
            method: 'POST',
            body: {
              presupuesto_id: state.selectedBudgetId,
              ciclo_id: getActiveCicloId(),
              tarjeta_id: fd.get('tarjeta_id'),
              monto: fd.get('monto'),
              concepto: fd.get('concepto'),
            }
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            showToast('✓ Diferencia de tarjeta sumada al período');
            await loadBudgetDetail(state.selectedBudgetId, state.selectedCicloId);
          } else {
            showToast((res.data && res.data.error) || 'Error al guardar diferencia');
          }
        };
      }

      const formPrestamoGuardarTarjeta = document.getElementById('formPrestamoGuardarTarjeta');
      if (formPrestamoGuardarTarjeta) {
        formPrestamoGuardarTarjeta.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formPrestamoGuardarTarjeta);
          const res = await apiFetch('/api/prestamo/tarjeta/guardar/', {
            method: 'POST',
            body: {
              presupuesto_id: state.selectedBudgetId,
              tarjeta_id: fd.get('tarjeta_id') || null,
              nombre: fd.get('nombre'),
              dia_cierre_habitual: fd.get('dia_cierre_habitual'),
              dia_vencimiento_habitual: fd.get('dia_vencimiento_habitual'),
              proxima_fecha_cierre: fd.get('proxima_fecha_cierre'),
              proxima_fecha_vencimiento: fd.get('proxima_fecha_vencimiento'),
              nota: fd.get('nota') || '',
            }
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            showToast('✓ Tarjeta del préstamo actualizada');
            await loadBudgetDetail(state.selectedBudgetId, state.selectedCicloId);
          } else {
            showToast((res.data && res.data.error) || 'Error al guardar tarjeta');
          }
        };
      }

      const formPrestamoCerrarCiclo = document.getElementById('formPrestamoCerrarCiclo');
      if (formPrestamoCerrarCiclo) {
        formPrestamoCerrarCiclo.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formPrestamoCerrarCiclo);
          const res = await apiFetch('/api/prestamo/cerrar-ciclo/', {
            method: 'POST',
            body: {
              presupuesto_id: state.selectedBudgetId,
              nuevo_nombre: fd.get('nuevo_nombre'),
              nueva_fecha_inicio: fd.get('nueva_fecha_inicio'),
              deuda_a_devolver: fd.get('deuda_a_devolver'),
            }
          });
          if (res.ok && res.data && res.data.success) {
            state.sheet = null;
            state.selectedCicloId = res.data.ciclo_id || 0;
            showToast('✓ Nuevo período iniciado');
            await loadBudgetDetail(state.selectedBudgetId, state.selectedCicloId);
          } else {
            showToast((res.data && res.data.error) || 'Error al cerrar período');
          }
        };
      }
    }

    // Exponer función global para refrescar desde SwipeRefresh de Android
    window.reloadAppData = function() {
      loadBudgetDetail(state.selectedBudgetId);
    };

    ensureTokenOrLoad();
  </script>
</body>
</html>
