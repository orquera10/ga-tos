<!DOCTYPE html>
<html lang="es">
<body style="margin:0;background:#111;font-family:Arial,sans-serif;color:#f4f4f4;">

            <p style="margin:0 0 6px;color:#00bfa6;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;">Ga$tos</p>

        </div>
    </div>
