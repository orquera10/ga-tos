{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica tu email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'presupuestos/css/styles.css' %}?v={{ app_version }}">
</head>
<body class="bg-black auth-body">
    <main class="auth-page">
        <section class="auth-shell form-shell">
            <div class="auth-logo-wrap">
                <img src="{% static 'presupuestos/img/logoGa$tos.png' %}" alt="Ga$tos" class="auth-logo">
            </div>

            <div class="auth-state-icon">
                <i class="bi bi-envelope-check"></i>
            </div>
            <div class="auth-heading">
                <p class="section-kicker mb-1">Casi listo</p>
                <h1 class="auth-title mb-0">Revisa tu email</h1>
            </div>

            <p class="auth-copy mb-4">
                Te enviamos un enlace de verificacion{% if email %} a {{ email }}{% endif %}.
                Abrilo para activar tu cuenta.
            </p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} auth-alert">
                        <i class="bi bi-info-circle"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'resend_verification' %}">
                {% csrf_token %}
                <div class="form-actions auth-actions mb-3">
                    <button type="submit" class="btn btn-outline-primary">
                        <i class="bi bi-envelope"></i> Reenviar enlace
                    </button>
                </div>
            </form>

            <div class="auth-footer auth-footer-standalone">
                <a href="{% url 'login' %}">Volver al login</a>
            </div>
        </section>
    </main>
</body>
</html>
