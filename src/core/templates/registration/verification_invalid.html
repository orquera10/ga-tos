{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace invalido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'presupuestos/css/styles.css' %}?v={{ app_version }}">
</head>
<body class="bg-black auth-body">
    <main class="auth-page">
        <section class="auth-shell form-shell">
            <div class="auth-logo-wrap">
                <img src="{% static 'presupuestos/img/logoGa$tos.png' %}" alt="Ga$tos" class="auth-logo">
            </div>

            <div class="auth-state-icon auth-state-icon-danger">
                <i class="bi bi-x-lg"></i>
            </div>
            <div class="auth-heading">
                <p class="section-kicker mb-1">Verificacion</p>
                <h1 class="auth-title mb-0">Enlace invalido</h1>
            </div>

            <p class="auth-copy mb-4">
                El enlace de verificacion no existe o ya no esta disponible.
            </p>

            <div class="auth-footer auth-footer-standalone">
                <a href="{% url 'register' %}">Crear una cuenta</a>
            </div>
        </section>
    </main>
</body>
</html>
