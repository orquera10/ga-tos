name: Compilar APK Android

on:
  push:
    branches:
      - production
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar Wrapper y Compilar APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Gastos-App-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publicar Release directo con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Ga$tos Android APK v1.2.0"
          body: |
            ### App Android de Ga$tos con Widget v1.2.0
            - **Widget compacto de 1 sola línea**: Se adapta a una fila de tu pantalla de inicio con presupuesto, saldo restante, + Gasto, + Ingreso y refresco rápido.
            - **Ventanas flotantes independientes**: Al presionar "+ Gasto" o "+ Ingreso" desde el widget, el diálogo flotante se abre sobre la pantalla actual sin traer la aplicación completa al frente.
            - **Diseño del diálogo mejorado**: Ancho más cómodo y botones 50/50 balanceados sin cortes ni solapamientos.
            - Descarga **app-debug.apk** para instalar o actualizar.
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
