name: Compilar APK Android

on:
  push:
    branches:
      - production
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar Wrapper y Compilar APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || touch FAILED
          cd ..
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B debug-build-log
          git add -f android/build.log
          git commit -m "debug: full build log" || true
          git push -f origin debug-build-log || true
          if [ -f android/FAILED ]; then
            echo "::error::Gradle assembleDebug failed"
            cat android/build.log | tail -n 150
            exit 1
          fi
          echo "=== Verificando APK generado ==="
          ls -la android/app/build/outputs/apk/debug/

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Gastos-App-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publicar Release directo con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: "Ga$tos Android APK v2.1.1"
          body: |
            ### App Android de Ga$tos v2.1.0 — Edición/Eliminación en Modal + Nuevo Widget Estética Figma
            - **Editar y Eliminar Movimientos desde Modal Inferior**: Tocá cualquier gasto, ingreso o transferencia en `Inicio` o `Movimientos` para abrir el modal animado que sube desde abajo y modificar sus datos o eliminarlo.
            - **Marcado Automático de Movimientos del Widget (`⚡ Completar`)**: Todos los gastos e ingresos cargados desde el Widget quedan marcados con el badge `⚡ Completar` y filtro rápido para que puedas completarlos con categoría, cuenta y etiquetas cuando entres a la app.
            - **Widget Rediseñado con la Nueva Estética Figma**: Nuevo diseño oscuro (`#151821`) con píldora violeta para el selector de presupuesto, botón coral (`↑ Gasto`) y botón esmeralda (`↓ Ingreso`).
            - Descarga **app-debug.apk** para instalar o actualizar.
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
