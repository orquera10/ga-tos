name: Compilar APK Android

on:
  push:
    branches:
      - production
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar Wrapper y Compilar APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "=== Verificando APK generado ==="
          ls -la app/build/outputs/apk/debug/

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Gastos-App-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publicar Release directo con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.1
          name: "Ga$tos Android APK v1.5.1"
          body: |
            ### App Android de Ga$tos v1.5.1
            - **Desbloqueo Biométrico (Huella digital / PIN)**: Protección biométrica al abrir la aplicación.
            - **Sincronización 100% Automática del Widget**: Al iniciar sesión en la web, el widget se vincula solo sin pedir contraseña adicional.
            - **Botones y diálogos corregidos**: Diálogos con botón cancelar en rojo, guardar del tamaño completo y selector de medio de pago/tipo de ingreso.
            - Descarga **app-debug.apk** para instalar o actualizar.
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
