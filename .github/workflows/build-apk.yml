name: Compilar APK Android

on:
  push:
    branches:
      - production
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar Wrapper y Compilar APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || touch FAILED
          cd ..
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B debug-build-log
          git add -f android/build.log
          git commit -m "debug: full build log" || true
          git push -f origin debug-build-log || true
          if [ -f android/FAILED ]; then
            echo "::error::Gradle assembleDebug failed"
            cat android/build.log | tail -n 150
            exit 1
          fi
          echo "=== Verificando APK generado ==="
          ls -la android/app/build/outputs/apk/debug/

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Gastos-App-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publicar Release directo con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: "Ga$tos Android APK v1.6.0"
          body: |
            ### App Android de Ga$tos v1.6.0
            - **Etiquetas de Personas / Destinatario**: Asigna a qué persona corresponde el gasto (hija, victoria, personal, etc.) directamente desde el widget y la app.
            - **Cuentas Bancarias y Billeteras**: Registra a qué banco/billetera (Brubank, Mercado Pago, Ualá, Galicia, etc.) va o de dónde sale cada movimiento, con visualización de saldos por entidad.
            - **Diálogos de Gasto e Ingreso 100% Optimizados**: Formularios con scroll suave, botón Cancelar en rojo, botón Guardar completo y visible sin recortes.
            - **Sincronización 100% Automática del Widget**: Al iniciar sesión en la web, el widget se vincula solo sin pedir contraseña.
            - **Soporte de flujo continuo y tarjetas diferidas**.
            - Descarga **app-debug.apk** para instalar o actualizar.
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
