name: Compilar APK Android

on:
  push:
    branches:
      - production
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar Wrapper y Compilar APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || touch FAILED
          cd ..
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B debug-build-log
          git add -f android/build.log
          git commit -m "debug: full build log" || true
          git push -f origin debug-build-log || true
          if [ -f android/FAILED ]; then
            echo "::error::Gradle assembleDebug failed"
            cat android/build.log | tail -n 150
            exit 1
          fi
          echo "=== Verificando APK generado ==="
          ls -la android/app/build/outputs/apk/debug/

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Gastos-App-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publicar Release directo con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.2
          name: "Ga$tos Android APK v2.2.2"
          body: |
            ### App Android de Ga$tos v2.2.0 — Categorías Dinámicas, Billetera Favorita ⭐ y Detección Automática en Widget
            - **Conservación de Datos en Formularios**: Al elegir tags de persona o medio de pago en gastos/edición ya no se borra la categoría ni el resto de los campos.
            - **Categorías Dinámicas con Chips y Autocompletado**: Podés tocar una categoría existente como chip o escribir el nombre de una nueva categoría para crearla en el momento.
            - **Billetera Favorita (`⭐`) y Orden Inteligente**: Marcá tu billetera favorita en `Cuentas` para que aparezca primera y preseleccionada al elegir transferencia, seguida por las billeteras con saldo positivo.
            - **Detección Automática en Gastos/Ingresos Rápidos del Widget**: Si en el concepto del widget escribís `efectivo` o `transferencia`, se asigna automáticamente ese medio de pago (y tu billetera favorita si es transferencia).
            - Descarga **app-debug.apk** para instalar o actualizar.
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
