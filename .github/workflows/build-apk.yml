name: Compilar APK Android

on:
  push:
    branches:
      - production
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar Wrapper y Compilar APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || touch FAILED
          cd ..
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B debug-build-log
          git add -f android/build.log
          git commit -m "debug: full build log" || true
          git push -f origin debug-build-log || true
          if [ -f android/FAILED ]; then
            echo "::error::Gradle assembleDebug failed"
            cat android/build.log | tail -n 150
            exit 1
          fi
          echo "=== Verificando APK generado ==="
          ls -la android/app/build/outputs/apk/debug/

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Gastos-App-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publicar Release directo con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: "Ga$tos Android APK v2.0.1"
          body: |
            ### App Android de Ga$tos v2.0.1 — Rediseño Moderno (Figma) + Control de Préstamo
            - **Nueva Interfaz Moderna**: Rediseño completo fiel al prototipo de Figma con barra de navegación inferior (`Inicio`, `Movimientos`, `Análisis`, `Cuentas`) y botón flotante (`+`).
            - **Soporte completo para Presupuestos tipo Préstamo**: Panel de ciclos/períodos, tarjetas del préstamo con semáforo de fechas de cierre (`Patagonia Rubén`, `Patagonia Palmira`, `Naranja`), carga de `+ Ingreso Tarjeta` (con cálculo automático del 4.5%), `+ Ingreso Efectivo`, `+ Diferencia Tarjeta` (resúmenes), cierre de ciclo y cronograma de proyección mes a mes en `Análisis`.
            - **Selector de Presupuesto en Foco y Sección Cuentas**: Elegí cualquier presupuesto desde arriba y gestioná tus cuentas y transferencias.
            - Descarga **app-debug.apk** para instalar o actualizar.
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
